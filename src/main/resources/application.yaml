spring:
  application:
    name: signaling-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

worker:
  ready-timeout: ${WORKER_READY_TIMEOUT:3s}
  connect-timeout: ${WORKER_CONNECT_TIMEOUT:3s}
  sdp-timeout: ${WORKER_SDP_TIMEOUT:20s}
  sdp-read-timeout-slack: ${WORKER_SDP_READ_TIMEOUT_SLACK:5s}
  call-executor-pool-size: ${WORKER_CALL_EXECUTOR_POOL_SIZE:100}

rooms:
  dev-ttl: ${ROOMS_DEV_TTL:}

internal:
  secret: ${INTERNAL_SECRET:}

logging:
  level:
    com.cloudgaming.signalingservice: ${LOG_LEVEL:INFO}
    org.springframework.web.socket: ${LOG_LEVEL_WEBSOCKET:INFO}